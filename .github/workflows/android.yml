name: تطبيق أندرويد
on:
  push:
    branches: [main]
    paths: ['android-src/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: بناء المشروع
        run: |
          pip install pillow
          mkdir app && cd app
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www && cp ../index.html ../quran.js ../hisn.js ../manifest.webmanifest ../icon-*.png ../sw.js www/
          cp ../android-src/capacitor.config.json .
          AR=https://archive.org/download/adhan.recordings.from.doha.qatar
          i=1; for p in fajr dhuhr asr maghrib isha; do n=$(echo "Fajr Dhuhr Asr Maghrib Isha" | cut -d' ' -f$i); curl -sL -m 120 -o adhan_$p.ogg "$AR/Adhan_Doha_Qatar_0${i}_${n}_Adhan.ogg" || true; i=$((i+1)); done; ls -la adhan_*.ogg || true
          npx cap add android
          python3 ../android-src/patch.py
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../yomi.apk
      - name: نشر الـ APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: يومي للأندرويد — نسخة ${{ github.run_number }}
          body: "نزّل ملف yomi.apk وسطّبه على موبايلك."
          files: yomi.apk
          make_latest: true
      - name: نسخة من الـ APK على موقع التطبيق
        run: |
          git config user.name "Claude" && git config user.email "claude@users.noreply.github.com"
          git pull -q origin main
          git add -f yomi.apk && git commit -q -m "تحديث ملف APK" && git push -q origin main || true
